# Copy to .github/workflows/release.yml in the repository that publishes releases.
name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the version commit, the tag, and the release
    steps:
      # fetch-depth: 0 — the next version is computed from the last tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: OWNER/newsbump/actions/release@0.2.0
        # Defaults shown; delete any line you do not need to change.
        with:
          news-dir: news
          pyproject: pyproject.toml
          tag-prefix: ""        # "v" for v1.2.3 tags
          zero-major: minor     # "major" for strict semver below 1.0.0
