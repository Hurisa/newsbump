# Copy to .github/workflows/pull-request.yml in the repository that needs the check.
#
# Pin a tag, not @main: the pin covers the action and the script it runs, so the tool
# cannot change under you.
name: pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the check compares this branch against where it left the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: OWNER/newsbump/actions/news-check@0.2.0
