
# This repository releases itself with its own action. It is not a Python package, so
# there is no [project] version to write: it gets a tag and a release, which is what a
# caller pins against.
name: self release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./actions/release
