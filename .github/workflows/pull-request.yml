
# newsbump asks the same of itself that it asks of its callers. The local path is the
# version on this branch, so a change to the check is tested by the pull request making it.
name: pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./actions/news-check
